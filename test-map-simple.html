<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .map-container {
            height: 400px;
            width: 100%;
            position: relative;
            border: 1px solid #e4e7ed;
            border-radius: 4px;
            overflow: hidden;
            background: #f5f7fa;
        }
        .guangdong-map {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .city {
            fill: #e0e0e0;
            stroke: #ffffff;
            stroke-width: 1;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .city:hover {
            fill: #ffd700;
            stroke: #333;
            stroke-width: 2;
        }
        .city-label {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            font-size: 10px;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
        }
        .province-label {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
        }
        .map-legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            padding: 12px;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid #ffffff;
        }
        .legend-dot.excellent { background: #52c41a; }
        .legend-dot.good { background: #1890ff; }
        .legend-dot.warning { background: #faad14; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>广东省风险健康度地图测试</h1>
        <div class="map-container">
            <div class="guangdong-map">
                <svg width="100%" height="100%" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- 北部区域 -->
                    <path d="M 110 60 L 140 55 L 170 65 L 190 80 L 180 95 L 150 90 L 120 75 L 110 60 Z" 
                          class="city" 
                          fill="#52c41a"
                          onclick="alert('韶关市')"/>
                    <path d="M 80 100 L 120 95 L 150 105 L 170 120 L 160 135 L 130 130 L 100 115 L 80 100 Z" 
                          class="city" 
                          fill="#1890ff"
                          onclick="alert('清远市')"/>
                    <path d="M 580 80 L 620 75 L 650 85 L 670 100 L 660 115 L 630 110 L 600 95 L 580 80 Z" 
                          class="city" 
                          fill="#faad14"
                          onclick="alert('梅州市')"/>
                    
                    <!-- 中部区域 -->
                    <path d="M 180 180 L 220 175 L 250 185 L 270 200 L 260 215 L 230 210 L 200 195 L 180 180 Z" 
                          class="city" 
                          fill="#52c41a"
                          onclick="alert('广州市')"/>
                    <path d="M 160 210 L 200 205 L 230 215 L 250 230 L 240 245 L 210 240 L 180 225 L 160 210 Z" 
                          class="city" 
                          fill="#1890ff"
                          onclick="alert('佛山市')"/>
                    <path d="M 260 210 L 300 205 L 330 215 L 350 230 L 340 245 L 310 240 L 280 225 L 260 210 Z" 
                          class="city" 
                          fill="#52c41a"
                          onclick="alert('东莞市')"/>
                    
                    <!-- 南部区域 -->
                    <path d="M 260 320 L 300 315 L 330 325 L 350 340 L 340 355 L 310 350 L 280 335 L 260 320 Z" 
                          class="city" 
                          fill="#52c41a"
                          onclick="alert('深圳市')"/>
                    <path d="M 180 350 L 220 345 L 250 355 L 270 370 L 260 385 L 230 380 L 200 365 L 180 350 Z" 
                          class="city" 
                          fill="#1890ff"
                          onclick="alert('珠海市')"/>
                    
                    <!-- 城市标签 -->
                    <text x="150" y="77" class="city-label">韶关</text>
                    <text x="125" y="117" class="city-label">清远</text>
                    <text x="625" y="97" class="city-label">梅州</text>
                    <text x="225" y="197" class="city-label">广州</text>
                    <text x="205" y="227" class="city-label">佛山</text>
                    <text x="305" y="227" class="city-label">东莞</text>
                    <text x="305" y="332" class="city-label">深圳</text>
                    <text x="225" y="367" class="city-label">珠海</text>
                    
                    <!-- 省份标题 -->
                    <text x="400" y="30" class="province-label">广东省风险健康度地图</text>
                </svg>
                
                <!-- 图例 -->
                <div class="map-legend">
                    <div class="legend-title">健康度等级</div>
                    <div class="legend-items">
                        <div class="legend-item">
                            <div class="legend-dot excellent"></div>
                            <span>优秀 (90-99)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot good"></div>
                            <span>良好 (80-89)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot warning"></div>
                            <span>警告 (70-79)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <p style="margin-top: 20px; color: #666;">
            测试说明：点击地图上的城市区域可以看到城市名称。地图显示了各个城市的实际轮廓线条。
        </p>
    </div>
</body>
</html>
